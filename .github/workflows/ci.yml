# CI - every PR to main and every push to main. No deploy, no cloud credentials.
#
#   Lint -> Type Check -> Unit Tests -> Integration Tests -> Build
#
# Integration Tests run against REAL services (GitHub service containers):
#   PostgreSQL 16  -> isolated database user_service_test (tests refuse any
#                     database whose name does not contain "test")
#   Kafka 3.9.1    -> KRaft single node on localhost:9092; every test uses its
#                     own throw-away topic and consumer group
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  # Tests never need a trace backend; keeps exporter retries out of the logs.
  OTEL_SDK_DISABLED: "true"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check .
      - name: hadolint
        run: docker run --rm -i hadolint/hadolint:v2.15.1 hadolint --failure-threshold warning - < Dockerfile
      - name: shellcheck
        run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 --severity=warning docker-entrypoint.sh

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: mypy

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: pytest -m unit
        run: >
          pytest -m unit --maxfail=10 -o addopts=""
          --cov --cov-report=term --cov-report=xml:coverage-unit.xml
          --junitxml=junit-unit.xml
      - name: Coverage summary
        if: always()
        run: |
          echo "Unit coverage: $(coverage report --format=total)%" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-reports
          path: |
            junit-unit.xml
            coverage-unit.xml
          retention-days: 7

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      kafka:
        # Default config of the official image: single-node KRaft, advertised
        # as localhost:9092, auto topic creation on - same semantics as the lab.
        image: apache/kafka:3.9.1
        ports: ["9092:9092"]
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s --health-timeout 10s --health-retries 20 --health-start-period 20s
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/user_service_test
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Migrations (alembic upgrade head on a fresh test database)
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE user_service_migrations_test"
          DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/user_service_migrations_test \
            alembic upgrade head
      - name: pytest -m integration (real PostgreSQL + real Kafka)
        run: >
          pytest -m integration -o addopts=""
          --cov --cov-report=term --cov-report=xml:coverage-integration.xml
          --junitxml=junit-integration.xml
      - name: Coverage summary
        if: always()
        run: |
          echo "Integration coverage: $(coverage report --format=total)%" >> "$GITHUB_STEP_SUMMARY"
      - name: Service logs
        if: failure()
        run: |
          docker logs "${{ job.services.kafka.id }}" > kafka.log 2>&1
          docker logs "${{ job.services.postgres.id }}" > postgres.log 2>&1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-test-reports
          path: |
            junit-integration.xml
            coverage-integration.xml
            *.log
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: docker build
        run: docker build -t user-service:ci .
      - name: Image runs as non-root
        run: test "$(docker image inspect -f '{{.Config.User}}' user-service:ci)" = "1000"
      - name: Container scan (Trivy, HIGH/CRITICAL with a fix available)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0 \
            image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 user-service:ci
      - name: docker compose config
        run: docker compose config --quiet
